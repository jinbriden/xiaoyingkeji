spring:
  datasource:
    url: jdbc:h2:mem:studio;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

app:
  storage:
    root: ./target/test-storage
  task:
    worker-threads: 2
    dispatch-interval-ms: 50
  simulation:
    asset-check-delay-ms: 0
    generate-delay-ms: 0
    result-delay-ms: 0
    fail-stage: ""
  dev-api:
    enabled: true
